<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Söz Tapmaca — Adam Asma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161d;
    --panel: #1b2129;
    --panel-2: #222a34;
    --line: #33404f;
    --gold: #c99a4a;
    --gold-dim: #8a6f3d;
    --green: #4f9d72;
    --red: #b6495c;
    --ink: #ece4d3;
    --ink-dim: #a7a196;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2230 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #1c1620 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }

  .buta-strip{
    height:10px;
    width:100%;
    background-image: repeating-linear-gradient(135deg, var(--gold) 0 3px, transparent 3px 14px);
    opacity:.55;
  }
  .buta-strip.bottom{opacity:.3;}

  .card{
    width:100%;
    max-width:560px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }

  .card-body{
    padding: 26px 26px 30px;
  }

  h1{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size: 1.7rem;
    letter-spacing:.2px;
    margin: 2px 0 4px;
    color: var(--ink);
  }
  .tagline{
    color:var(--ink-dim);
    font-size:.92rem;
    margin:0 0 20px;
  }

  .hangman-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-bottom: 16px;
    flex-wrap:wrap;
  }

  .hangman-box{
    background: rgba(0,0,0,.18);
    border:1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px 2px;
  }
  .hangman-box svg{
    display:block;
    width: 150px;
    height: 165px;
  }

  .status-col{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }
  .wrong-count{
    font-family:'Zilla Slab', serif;
    font-size:1.05rem;
    color: var(--ink);
  }
  .wrong-count b{
    color: var(--red);
    font-size:1.3rem;
  }
  .wrong-count .of{
    color: var(--ink-dim);
    font-size:.95rem;
  }

  .word-display{
    font-family:'Zilla Slab', serif;
    font-size: clamp(1.7rem, 6vw, 2.5rem);
    letter-spacing: 10px;
    text-align:center;
    padding: 26px 10px;
    margin: 4px 0 6px;
    background: rgba(0,0,0,.18);
    border:1px solid var(--line);
    border-radius: 12px;
    word-break: break-all;
    min-height: 1.6em;
  }

  .wrong-letters{
    text-align:center;
    color: var(--red);
    min-height: 1.3em;
    font-size:.9rem;
    letter-spacing:1px;
    margin-bottom: 6px;
  }

  .message{
    text-align:center;
    min-height: 1.4em;
    font-size: .98rem;
    margin: 6px 0 14px;
    line-height:1.5;
  }
  .message.win{ color: var(--green); font-weight:700; font-size:1.1rem; }
  .message.lose{ color: var(--red); font-weight:700; font-size:1.1rem; }

  .toast{
    text-align:center;
    color: var(--ink-dim);
    font-size:.85rem;
    min-height: 1.2em;
    margin-bottom: 10px;
  }

  .keyboard{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 7px;
    margin-bottom: 8px;
  }
  @media (max-width:420px){
    .keyboard{ grid-template-columns: repeat(6, 1fr); }
  }

  .key{
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size: .95rem;
    cursor:pointer;
    transition: background .12s ease, transform .06s ease, border-color .12s ease;
  }
  .key:hover:not(:disabled){ border-color: var(--gold-dim); }
  .key:active:not(:disabled){ transform: scale(.94); }
  .key:disabled{ cursor:default; }
  .key.correct{ background: rgba(79,157,114,.25); border-color: var(--green); color:#cdeedd; }
  .key.wrong{ background: rgba(182,73,92,.2); border-color: var(--red); color:#f0c3cb; opacity:.75; }

  .footer-actions{
    display:flex;
    justify-content:center;
    margin-top: 16px;
  }
  #newWordBtn{
    display:none;
    background: var(--gold);
    color: #21170a;
    border:none;
    padding: 12px 26px;
    border-radius: 10px;
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:.98rem;
    cursor:pointer;
    transition: transform .1s ease, filter .12s ease;
  }
  #newWordBtn:hover{ filter:brightness(1.08); }
  #newWordBtn:active{ transform: scale(.97); }

  .meta{
    text-align:center;
    color: var(--ink-dim);
    font-size:.78rem;
    margin-top: 18px;
  }

  .hg-line, .hg-rope{ stroke: var(--ink-dim); stroke-width:4; stroke-linecap:round; fill:none; }
  .hg-figure{ stroke: var(--gold); stroke-width:4; stroke-linecap:round; fill:none; }
  .hg-head{ stroke: var(--gold); stroke-width:4; fill:none; }
  .hg-part{ opacity:0; transition: opacity .25s ease; }
  .hg-part.show{ opacity:1; }
</style>
</head>
<body>

<div class="card">
  <div class="buta-strip"></div>
  <div class="card-body">
    <h1>Söz Tapmaca</h1>
    <p class="tagline">Gizli sözü hərf-hərf tapmağa çalış.</p>

          <line id="hg-2" class="hg-line hg-part" x1="30" y1="155" x2="30" y2="15"/>

            <line class="hg-figure" x1="100" y1="100" x2="116" y2="130"/>
          </g>
        </svg>
      </div>
      <div class="status-col">
        <div class="wrong-count">Səhv: <b id="wrongCount">0</b><span class="of"> / 8</span></div>
      </div>
    </div>

    <div class="word-display" id="wordDisplay"></div>
    <div class="wrong-letters" id="wrongLetters"></div>
    <div class="message" id="message"></div>
    <div class="toast" id="toast"></div>

    <div class="keyboard" id="keyboard"></div>

    <div class="footer-actions">
      <button id="newWordBtn">Yeni söz →</button>
    </div>

    <div class="meta" id="wordCountMeta"></div>
  </div>
  <div class="buta-strip bottom"></div>
</div>

/* ================== ƏLİFBA ================== */
const ALPHABET = ["A","B","C","Ç","D","E","Ə","F","G","Ğ","H","X","I","İ","J","K","Q","L","M","N","O","Ö","P","R","S","Ş","T","U","Ü","V","Y","Z"];

/* ================== OYUN VƏZİYYƏTİ ================== */
const MAX_WRONG = 8;
let usedWords = new Set();
let currentWord = null;
let guessedLetters = new Set();
let wrongList = [];
let wrong = 0;
let gameOver = false;
let toastTimer = null;

const el = {
  word: document.getElementById('wordDisplay'),
  wrongLetters: document.getElementById('wrongLetters'),
  message: document.getElementById('message'),
  toast: document.getElementById('toast'),
  keyboard: document.getElementById('keyboard'),
  newWordBtn: document.getElementById('newWordBtn'),
  wordCountMeta: document.getElementById('wordCountMeta'),
  wrongCount: document.getElementById('wrongCount'),
};

function toUpperAz(str){
  return str.toLocaleUpperCase('az');
}

function pickWord(){
  let available = WORDS.filter(x => !usedWords.has(x.w));
  if(available.length === 0){
    usedWords.clear();
    available = WORDS;
  }
  return available[Math.floor(Math.random() * available.length)];
}

function buildKeyboard(){
  el.keyboard.innerHTML = '';
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'key';
    btn.textContent = letter;
    btn.id = 'key-' + letter;
    btn.addEventListener('click', () => guessLetter(letter));
    el.keyboard.appendChild(btn);
  });
}

function renderWord(){
  el.word.textContent = currentWord.w.split('').map(ch => guessedLetters.has(ch) ? ch : '_').join(' ');
}

function renderHangman(){
  el.wrongCount.textContent = wrong;
  for(let i = 1; i <= MAX_WRONG; i++){
    const part = document.getElementById('hg-' + i);
    if(!part) continue;
    if(i <= wrong){
      part.classList.add('show');
    } else {
      part.classList.remove('show');
    }
  }
}

function renderWrongLetters(){
  el.wrongLetters.textContent = wrongList.length ? ('Səhv hərflər: ' + wrongList.join(', ')) : '';
}

function showToast(text){
  el.toast.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.textContent = ''; }, 2000);
}

function startGame(){
  currentWord = pickWord();
  usedWords.add(currentWord.w);
  guessedLetters = new Set();
  wrongList = [];
  wrong = 0;
  gameOver = false;

  el.message.textContent = '';
  el.message.className = 'message';
  el.toast.textContent = '';
  el.newWordBtn.style.display = 'none';

  buildKeyboard();
  renderWord();
  renderHangman();
  renderWrongLetters();
}

function guessLetter(rawLetter){
  if(gameOver) return;
  const letter = toUpperAz(rawLetter);
  if(!ALPHABET.includes(letter)) return;

  const btn = document.getElementById('key-' + letter);

  if(guessedLetters.has(letter)){
    showToast('Bu hərfi artıq seçmisiniz!');
    return;
  }

  guessedLetters.add(letter);
  if(btn) btn.disabled = true;

  if(currentWord.w.includes(letter)){
    if(btn) btn.classList.add('correct');
    renderWord();
    if(currentWord.w.split('').every(ch => guessedLetters.has(ch))){
      endGame(true);
    }
  } else {
    wrong++;
    if(btn) btn.classList.add('wrong');
    wrongList.push(letter);
    renderHangman();
    renderWrongLetters();
    if(wrong >= MAX_WRONG){
      endGame(false);
    }
  }
}

function endGame(won){
  gameOver = true;
  document.querySelectorAll('.key').forEach(b => b.disabled = true);
  el.newWordBtn.style.display = 'inline-block';

  if(won){
    el.message.textContent = '🎉 Təbriklər! Sözü tapdın: ' + currentWord.w;
    el.message.className = 'message win';
    el.newWordBtn.textContent = 'Yeni söz →';
  } else {
    el.word.textContent = currentWord.w.split('').join(' ');
    el.message.textContent = '💀 Oyun bitdi! Doğru söz: ' + currentWord.w;
    el.message.className = 'message lose';
    el.newWordBtn.textContent = 'Yenidən oyna →';
  }
}

el.newWordBtn.addEventListener('click', startGame);

document.addEventListener('keydown', (e) => {
  if(e.key.length === 1){
    const up = toUpperAz(e.key);
    if(ALPHABET.includes(up)) guessLetter(up);
  }
});

el.wordCountMeta.textContent = WORDS.length + ' söz • ' +
  [...new Set(WORDS.map(x => x.c))].length + ' kateqoriya';

startGame();
</script>
</body>
</html>
